<style>
  body.docs-nav-collapsed .side-bar {
    transform: translateX(-100%);
  }

  body.docs-nav-collapsed .main {
    width: 100%;
    max-width: none;
    margin-left: 0;
  }

  .side-bar,
  .main {
    transition: transform 180ms ease, margin-left 180ms ease, width 180ms ease, max-width 180ms ease;
  }

  /* Sit in the Just the Docs header flex row — no fixed offsets.
     Stick below the announcement so the row is never covered by it. */
  body.docs-nav-collapse-page #main-header {
    position: sticky;
    top: var(--announcement-h, 0px);
    z-index: 900;
    align-items: center;
    gap: 0.65rem;
    padding-left: 0.75rem;
    padding-right: 0.75rem;
    background-color: #ffffff;
  }

  body.docs-nav-collapse-page #main-header .search {
    flex: 1 1 auto;
    min-width: 0;
  }

  .docs-nav-toggle {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2.25rem;
    height: 2.25rem;
    margin: 0;
    padding: 0;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    background: #ffffff;
    color: #0f172a;
    box-shadow: 0 1px 2px rgb(15 23 42 / 0.05);
    cursor: pointer;
  }

  .docs-nav-toggle:hover {
    border-color: #94a3b8;
    color: #020617;
  }

  .docs-nav-toggle:focus-visible {
    outline: 2px solid #2563eb;
    outline-offset: 2px;
  }

  .docs-nav-toggle svg {
    width: 1.05rem;
    height: 1.05rem;
    display: block;
  }

  .docs-nav-toggle .docs-nav-icon-close {
    display: none;
  }

  body:not(.docs-nav-collapsed) .docs-nav-toggle .docs-nav-icon-menu {
    display: none;
  }

  body:not(.docs-nav-collapsed) .docs-nav-toggle .docs-nav-icon-close {
    display: block;
  }

  /* Mobile: Just the Docs owns the menu/search chrome. Don't slide the
     sidebar away or show our desktop toggle under the announcement. */
  @media (max-width: 49.99rem) {
    body.docs-nav-collapsed .side-bar {
      transform: none;
    }

    .docs-nav-toggle {
      display: none;
    }

    body.docs-nav-collapse-page #main-header {
      position: static;
      top: auto;
    }
  }
</style>

<script>
(function () {
  var STORAGE_KEY = "oopsieDocsNavCollapsed";
  var LEGACY_KEY = "oopsieVisualizerNavCollapsed";
  var DESKTOP_MQ = window.matchMedia("(min-width: 50rem)");

  function readStored() {
    var stored = localStorage.getItem(STORAGE_KEY);
    if (stored === null) {
      stored = localStorage.getItem(LEGACY_KEY);
      if (stored !== null) {
        localStorage.setItem(STORAGE_KEY, stored);
      }
    }
    return stored;
  }

  var stored = readStored();
  var collapsed = stored === null ? true : stored === "true";
  document.body.classList.add("docs-nav-collapse-page");

  function applyCollapsedClass() {
    document.body.classList.toggle("docs-nav-collapsed", collapsed && DESKTOP_MQ.matches);
  }

  applyCollapsedClass();

  function syncButton(button) {
    var label = collapsed ? "Show navigation" : "Hide navigation";
    button.setAttribute("aria-expanded", collapsed ? "false" : "true");
    button.setAttribute("aria-label", label);
    button.setAttribute("title", label);
  }

  function setNavigationCollapsed(next) {
    collapsed = next;
    applyCollapsedClass();
    localStorage.setItem(STORAGE_KEY, collapsed ? "true" : "false");
    document.querySelectorAll("[data-docs-nav-toggle]").forEach(syncButton);
  }

  function createToggleButton() {
    var button = document.createElement("button");
    button.className = "docs-nav-toggle";
    button.type = "button";
    button.setAttribute("data-docs-nav-toggle", "");
    button.innerHTML =
      '<svg class="docs-nav-icon-menu" viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
      '<path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>' +
      "</svg>" +
      '<svg class="docs-nav-icon-close" viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
      '<path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>' +
      "</svg>";
    return button;
  }

  function bind() {
    if (document.querySelector("[data-docs-nav-toggle]")) return;

    var header = document.getElementById("main-header");
    if (!header) return;

    var button = createToggleButton();
    header.insertBefore(button, header.firstChild);
    syncButton(button);
    button.addEventListener("click", function () {
      setNavigationCollapsed(!collapsed);
    });

    if (typeof DESKTOP_MQ.addEventListener === "function") {
      DESKTOP_MQ.addEventListener("change", applyCollapsedClass);
    } else if (typeof DESKTOP_MQ.addListener === "function") {
      DESKTOP_MQ.addListener(applyCollapsedClass);
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", bind);
  } else {
    bind();
  }
})();
</script>
