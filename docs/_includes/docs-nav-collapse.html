<style>
  body.docs-nav-collapsed .side-bar {
    transform: translateX(-100%);
  }

  body.docs-nav-collapsed .main {
    width: 100%;
    max-width: none;
    margin-left: 0;
  }

  .side-bar,
  .main {
    transition: transform 180ms ease, margin-left 180ms ease, width 180ms ease, max-width 180ms ease;
  }

  /* Keep the hamburger clear of the Just the Docs search bar. */
  body:has([data-docs-nav-toggle]) .main-header {
    padding-left: 3.25rem;
  }

  .docs-nav-toggle {
    --docs-nav-toggle-size: 2.25rem;
    position: fixed;
    top: calc(var(--announcement-h, 0px) + 0.7rem);
    left: 0.75rem;
    z-index: 101;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: var(--docs-nav-toggle-size);
    height: var(--docs-nav-toggle-size);
    padding: 0;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    background: #ffffff;
    color: #0f172a;
    box-shadow: 0 1px 2px rgb(15 23 42 / 0.06), 0 4px 12px rgb(15 23 42 / 0.08);
    cursor: pointer;
  }

  .docs-nav-toggle:hover {
    border-color: #94a3b8;
    color: #020617;
  }

  .docs-nav-toggle:focus-visible {
    outline: 2px solid #2563eb;
    outline-offset: 2px;
  }

  .docs-nav-toggle svg {
    width: 1.05rem;
    height: 1.05rem;
    display: block;
  }

  .docs-nav-toggle .docs-nav-icon-close {
    display: none;
  }

  body:not(.docs-nav-collapsed) .docs-nav-toggle .docs-nav-icon-menu {
    display: none;
  }

  body:not(.docs-nav-collapsed) .docs-nav-toggle .docs-nav-icon-close {
    display: block;
  }

  @media (min-width: 50rem) {
    body:not(.docs-nav-collapsed) .docs-nav-toggle {
      left: calc(15.5rem + 0.65rem);
    }
  }
</style>

<button
  class="docs-nav-toggle"
  type="button"
  data-docs-nav-toggle
  aria-controls="site-nav"
  aria-expanded="false"
  aria-label="Show navigation"
  title="Show navigation"
>
  <svg class="docs-nav-icon-menu" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </svg>
  <svg class="docs-nav-icon-close" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </svg>
</button>

<script>
(function () {
  var STORAGE_KEY = "oopsieDocsNavCollapsed";
  var LEGACY_KEY = "oopsieVisualizerNavCollapsed";

  function readStored() {
    var stored = localStorage.getItem(STORAGE_KEY);
    if (stored === null) {
      stored = localStorage.getItem(LEGACY_KEY);
      if (stored !== null) {
        localStorage.setItem(STORAGE_KEY, stored);
      }
    }
    return stored;
  }

  var stored = readStored();
  var collapsed = stored === null ? true : stored === "true";
  document.body.classList.toggle("docs-nav-collapsed", collapsed);

  function syncButtons() {
    var label = collapsed ? "Show navigation" : "Hide navigation";
    document.querySelectorAll("[data-docs-nav-toggle]").forEach(function (button) {
      button.setAttribute("aria-expanded", collapsed ? "false" : "true");
      button.setAttribute("aria-label", label);
      button.setAttribute("title", label);
    });
  }

  function setNavigationCollapsed(next) {
    collapsed = next;
    document.body.classList.toggle("docs-nav-collapsed", collapsed);
    localStorage.setItem(STORAGE_KEY, collapsed ? "true" : "false");
    syncButtons();
  }

  function bind() {
    var buttons = document.querySelectorAll("[data-docs-nav-toggle]");
    if (!buttons.length) return;
    syncButtons();
    buttons.forEach(function (button) {
      button.addEventListener("click", function () {
        setNavigationCollapsed(!document.body.classList.contains("docs-nav-collapsed"));
      });
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", bind);
  } else {
    bind();
  }
})();
</script>
